<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Snake Game</title>
  <desc id="description">A terminal-style banner with a green pixel snake and the title Snake Game.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56d364"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="30" y="30" width="1140" height="300" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>

  <g fill="none" stroke="url(#snake)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M75 255H282V195H135V108H270"/>
  </g>
  <g transform="translate(286 108)">
    <rect x="-33" y="-38" width="76" height="76" rx="22" fill="#39d353"/>
    <circle cx="18" cy="-13" r="5" fill="#0d1117"/>
    <path d="M43 12h25" stroke="#f85149" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="405" y="157" fill="#f0f6fc" font-size="78" font-weight="700" letter-spacing="3">SNAKE GAME</text>
    <text x="410" y="211" fill="#8b949e" font-size="25">5 stages. Dynamic missions. One terminal.</text>
    <rect x="410" y="247" width="315" height="56" rx="9" fill="#0d1117" stroke="#39d353" stroke-width="2"/>
    <text x="440" y="284" fill="#39d353" font-size="24" font-weight="700">$ make &amp;&amp; ./snake</text>
  </g>
</svg>
