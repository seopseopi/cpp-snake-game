name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ncurses
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ make libncurses-dev

      - name: Build and validate maps
        run: make check
